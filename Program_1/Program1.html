<!DOCTYPE html>
<html>
<head>
    <title>Student Record</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #e6f2ff, #ffffff);
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #003366;
            margin-bottom: 30px;
        }

        h2 {
            color: #004080;
            border-left: 5px solid #3399ff;
            padding-left: 10px;
        }

        ul, ol {
            background-color: #ffffff;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            width: 60%;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 70%;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        th {
            background-color: #3399ff;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        th, td {
            border: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f2f9ff;
        }
    </style>

</head>
<body>

    <h1>Student Record Information</h1>

    <h2>Student Details</h2>
    <ul>
        <li>Name: Rolex</li>
        <li>Department: AIDS</li>
        <li>Year: 2nd</li>
        <li>Section: A</li>
    </ul>

    <h2>Semester Subjects</h2>
    <ol>
        <li>Web Technology</li>
        <li>Software Construction</li>
        <li>Computer Networks</li>
    </ol>

    <h2 style="text-align:center;">Student Table</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Year</th>
        </tr>
        <tr>
            <td>24</td>
            <td>Anny</td>
            <td>AIDS</td>
            <td>2</td>
        </tr>
        <tr>
            <td>30</td>
            <td>Arun</td>
            <td>AIDS</td>
            <td>2</td>
        </tr>
    </table>

</body>
</html>
