<!DOCTYPE html>
<html>
<head>
    <title>Online Book Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Top Navigation Bar */
        .navbar {
            display: flex;
            justify-content: center;
            background-color: #4a90e2;
            padding: 15px 0;
        }

        .navbar a {
            text-decoration: none;
            color: white;
            margin: 0 20px;
            padding: 8px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background-color: white;
            color: #4a90e2;
        }

        iframe {
            width: 100%;
            height: 80vh;
            border: none;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>

<body>

    <h1>Online Book Store</h1>

    <div class="navbar">
        <a href="login.html" target="frame">Login</a>
        <a href="web.html" target="frame">Catalogue</a>
        <a href="reg.html" target="frame">Register</a>
    </div>

    <iframe name="frame"></iframe>

</body>
</html>
