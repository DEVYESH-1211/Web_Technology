<!DOCTYPE html>
<html>
<head>
    <title>Book Catalogue</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #f3f9ff, #ffffff);
            margin: 0;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 60%;
            margin: auto;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        th {
            background-color: #4a90e2;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        th, td {
            border: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f2f8ff;
        }
    </style>

</head>
<body>

    <h2>Books</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price (₹)</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Python</td>
            <td>500</td>
        </tr>
        <tr>
            <td>2</td>
            <td>DBMS</td>
            <td>400</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Web Technology</td>
            <td>600</td>
        </tr>
    </table>

</body>
</html>
