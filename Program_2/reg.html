<!DOCTYPE html>
<html>
<head>
    <title>Book Catalogue</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eef5ff, #ffffff);
            margin: 0;
            padding: 40px 0;
        }

        .container {
            width: 70%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            position: relative;
        }

        h2::after {
            content: "";
            width: 60px;
            height: 3px;
            background: #4a90e2;
            display: block;
            margin: 8px auto 0;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th {
            background-color: #4a90e2;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
        }

        th, td {
            border: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f2f8ff;
            transform: scale(1.01);
            transition: 0.2s;
        }

        .price {
            font-weight: bold;
            color: #27ae60;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: gray;
            font-size: 14px;
        }
    </style>

</head>
<body>

    <div class="container">
        <h2>Book Catalogue</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price (₹)</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Python</td>
                <td class="price">500</td>
            </tr>
            <tr>
                <td>2</td>
                <td>DBMS</td>
                <td class="price">400</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Web Technology</td>
                <td class="price">600</td>
            </tr>
        </table>

        <footer>
            © 2026 Online Book Store
        </footer>
    </div>

</body>
</html>
