<!DOCTYPE html>
<html>
<head>
    <title>Map with Hotspots and Frames</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #ecf0f1;
            padding: 10px;
            text-align: center;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
        }

        .container {
            display: flex;
        }

        .left {
            width: 50%;
            padding: 10px;
        }

        .right {
            width: 50%;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 2px solid gray;
        }
        .image-container {
            width: 500px;      
            border: 2px solid gray;
        }
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

<header>
    <h2>Map with Hotspots, Frames and Links</h2>
</header>

<nav>
    <a href="https://www.google.com" target="_blank">Google</a>
    <a href="https://www.wikipedia.org" target="_blank">Wikipedia</a>
    <a href="https://www.openstreetmap.org" target="_blank">OpenStreetMap</a>
</nav>

<div class="container">

    <!-- Left Section -->
    <div class="left">
        <h3>Embedded Map</h3>

        <!-- Embedded Google Map -->
        <iframe 
src="https://maps.google.com/maps?q=Chennai&t=&z=13&ie=UTF8&iwloc=&output=embed">
</iframe>

        <h3>Image Map (Hotspots)</h3>

        <div class="image-container">
            <img src="india.jpg" usemap="#india">
        </div>

        <map name="india">
            <area shape="rect" coords="100,100,200,200" 
                  href="https://en.wikipedia.org/wiki/Delhi" 
                  alt="Delhi" target="infoFrame">

            <area shape="circle" coords="250,300,50" 
                  href="https://en.wikipedia.org/wiki/Mumbai" 
                  alt="Mumbai" target="infoFrame">
        </map>

    </div>

    <!-- Right Section (Frame Section) -->
    <div class="right">
        <h3>Information Frame</h3>
        <iframe name="infoFrame"></iframe>
    </div>

</div>

</body>
</html>
