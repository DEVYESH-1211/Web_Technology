<!DOCTYPE html>
<html>
<head>
<title>Enhanced Internal CSS Example</title>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb);
    background-size: 400% 400%;
    animation: gradientMove 8s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 40px;
    width: 350px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    animation: slideIn 1.5s ease;
    transition: transform 0.3s ease;
}

.container:hover {
    transform: scale(1.05);
}

h1 {
    color: darkred;
    margin-bottom: 15px;
    text-shadow: 2px 2px 6px pink;
}

p {
    font-size: 18px;
    color: #333;
    margin-bottom: 20px;
}

button {
    background: linear-gradient(to right, green, darkgreen);
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

button:hover {
    background: linear-gradient(to right, #ff416c, #ff4b2b);
    transform: scale(1.1);
}


@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes slideIn {
    from {
        transform: translateY(-80px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

</style>
</head>

<body>

<div class="container">
    <h1>WTMA Internal CSS</h1>
    <p>This content is styled using <b>Internal CSS</b> with animations and modern UI.</p>
    <button>Submit</button>
</div>

</body>
</html>
