<!DOCTYPE html>
<html>
<head>
<title>Inline CSS Enhanced Example</title>
</head>

<body style="margin:0;
             font-family: Arial, sans-serif;
             background: linear-gradient(to right, #89f7fe, #66a6ff);
             display:flex;
             justify-content:center;
             align-items:center;
             height:100vh;">

<div style="background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
            width:350px;">

<h1 style="color:darkblue;
           margin-bottom:15px;
           text-shadow:2px 2px 5px lightblue;">
WTMA Inline CSS
</h1>

<p style="font-size:18px;
          color:#333;
          line-height:1.6;">
This paragraph is styled using <b>Inline CSS</b> with a modern look.
</p>

<button 
style="background:linear-gradient(to right, orange, red);
       color:white;
       padding:12px 20px;
       border:none;
       border-radius:8px;
       font-size:16px;
       cursor:pointer;
       transition:0.3s;"
       
onmouseover="this.style.transform='scale(1.1)'"
onmouseout="this.style.transform='scale(1)'">
Click Me
</button>

</div>

</body>
</html>
